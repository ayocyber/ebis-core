; Tender documents allow up to 50 MB each (ING-01), several per upload.
upload_max_filesize = 51M
post_max_size = 120M
max_file_uploads = 25
memory_limit = 256M
; Reading a tender's text runs during the upload on the free plan (no worker).
max_execution_time = 180
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
