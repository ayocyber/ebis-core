# Render Blueprint: free web service built from the Dockerfile.
# Values marked `sync: false` are secrets: Render asks for them when you
# create the Blueprint. See docs/deploy-render.md for where each comes from.
services:
  - type: web
    name: ebis-core
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      # App
      - key: APP_NAME
        value: ProcurPilot
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Europe/London
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # Database: Neon Postgres (free)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false

      # Sessions, cache and queue live in Postgres; no worker on the free plan.
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # Vault files: Supabase Storage (S3-compatible, free)
      - key: VAULT_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        value: vault
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

      # Email: written to the Render logs for now (nothing is sent).
      # To send real email with Gmail later, in Render → Environment set:
      #   MAIL_MAILER=smtp  MAIL_HOST=smtp.gmail.com  MAIL_PORT=587
      #   MAIL_ENCRYPTION=tls  MAIL_USERNAME / MAIL_FROM_ADDRESS = the Gmail address
      #   MAIL_PASSWORD = the Gmail app password
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: no-reply@procurpilot.test
      - key: MAIL_FROM_NAME
        value: ProcurPilot

      # Demo company for testers
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
